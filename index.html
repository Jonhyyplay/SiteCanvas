<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiteCanvas</title>
    <link rel="icon" href="./images/favicon.svg" type="image/svg+xml">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>

    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <link rel="stylesheet" href="style.css">

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="h-screen flex flex-col text-slate-800">

    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 shrink-0 z-30 shadow-sm relative">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-2 rounded-xl shadow-inner">
                <i data-feather="layout" class="text-white w-6 h-6"></i>
            </div>
            <h1 class="text-xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">
                SiteCanvas
            </h1>
        </div>
        
        <div class="flex-1 max-w-md mx-8 hidden md:block">
            <div class="flex justify-between text-xs font-bold text-indigo-600 mb-1.5">
                <span>Progresso (Nível Master)</span>
                <span id="progress-text">0%</span>
            </div>
            <div class="h-3 w-full bg-slate-100 rounded-full overflow-hidden shadow-inner border border-slate-200/50">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-indigo-400 to-purple-500 transition-all duration-700 ease-out w-0 rounded-full"></div>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="actions.undo()" title="Desfazer (Ctrl+Z)" class="flex items-center gap-2 px-3 py-2 text-slate-500 hover:text-slate-800 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg font-semibold transition text-sm">
                <i data-feather="corner-up-left" class="w-4 h-4"></i>
            </button>
            <button onclick="actions.redo()" title="Refazer (Ctrl+Y)" class="flex items-center gap-2 px-3 py-2 text-slate-500 hover:text-slate-800 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg font-semibold transition text-sm">
                <i data-feather="corner-up-right" class="w-4 h-4"></i>
            </button>
            <button onclick="actions.showCode()" class="flex items-center gap-2 px-4 py-2 text-slate-600 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg font-semibold transition text-sm">
                <i data-feather="code" class="w-4 h-4"></i> Ver Código
            </button>
            <button onclick="actions.clearSite()" class="flex items-center gap-2 px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 rounded-lg font-semibold transition text-sm">
                <i data-feather="trash-2" class="w-4 h-4"></i> Limpar Site
            </button>
            <button onclick="actions.previewSite()" class="flex items-center gap-2 px-4 py-2 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200 rounded-lg font-semibold transition text-sm">
                <i data-feather="eye" class="w-4 h-4"></i> Visualizar
            </button>
            <input type="file" id="import-file" accept=".html" class="hidden" onchange="actions.importSite(event)">
            <button onclick="document.getElementById('import-file').click()" class="flex items-center gap-2 px-4 py-2 bg-slate-50 text-slate-700 hover:bg-slate-100 border border-slate-200 rounded-lg font-semibold transition text-sm">
                <i data-feather="upload" class="w-4 h-4"></i> Importar
            </button>
            <button onclick="actions.exportSite()" class="flex items-center gap-2 px-5 py-2 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white rounded-lg font-bold shadow-md hover:shadow-lg transition transform hover:-translate-y-0.5 text-sm">
                <i data-feather="download" class="w-4 h-4"></i> Exportar
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        
        <aside class="w-72 bg-white border-r border-slate-200 flex flex-col shrink-0 z-20">
            <div class="p-5 border-b border-slate-100">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i data-feather="plus-square" class="w-4 h-4"></i> Adicionar Blocos
                </h2>
                <div class="grid grid-cols-2 gap-3" id="components-grid">
                    <!-- Preenchido via JS -->
                </div>
            </div>
            
            <div class="p-5 flex-1 overflow-y-auto bg-slate-50/50">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i data-feather="target" class="w-4 h-4"></i> Missões
                </h2>
                <ul id="missions-list" class="space-y-2.5">
                    <!-- Preenchido via JS -->
                </ul>
            </div>
        </aside>

        <main class="flex-1 bg-slate-200 overflow-y-auto p-4 md:p-8 flex justify-center items-start" id="main-area">
            <div class="bg-white w-full max-w-4xl min-h-[800px] rounded-xl shadow-2xl flex flex-col overflow-hidden transition-all duration-300 relative" id="browser-window">
                
                <!-- Background Image Container para o Canvas (Evita que o fundo fique só no container de padding) -->
                <div id="canvas-bg" class="absolute inset-0 z-0 bg-cover bg-center pointer-events-none"></div>

                <div class="bg-slate-100 px-4 py-3 border-b border-slate-200 flex items-center justify-between select-none z-10 relative">
                    <div class="flex gap-2">
                        <div class="w-3.5 h-3.5 rounded-full bg-red-400 border border-red-500/20"></div>
                        <div class="w-3.5 h-3.5 rounded-full bg-amber-400 border border-amber-500/20"></div>
                        <div class="w-3.5 h-3.5 rounded-full bg-green-400 border border-green-500/20"></div>
                    </div>
                    <div class="bg-white text-slate-400 text-xs px-12 py-1.5 rounded-md border border-slate-200 flex items-center gap-2 font-mono shadow-sm">
                        <i data-feather="lock" class="w-3 h-3 text-slate-300"></i> SiteCanvas.html
                    </div>
                    <div class="w-16"></div>
                </div>
                
                <div class="p-8 flex-1 z-10 relative" id="canvas-content">
                    <!-- Elementos renderizados aqui via JS -->
                </div>
            </div>
        </main>

        <aside class="w-80 bg-white border-l border-slate-200 flex flex-col shrink-0 z-20 shadow-[-10px_0_15px_-3px_rgba(0,0,0,0.02)]">
            <div class="p-5 border-b border-slate-100 bg-slate-50">
                <h2 class="text-xs font-black text-slate-700 uppercase tracking-widest flex items-center gap-2">
                    <i data-feather="sliders" class="w-4 h-4 text-indigo-500"></i> Personalizar
                </h2>
            </div>
            <div class="p-5 flex-1 overflow-y-auto" id="properties-panel">
                <!-- Preenchido via JS -->
            </div>
        </aside>
    </div>

    <!-- Modais -->
    <dialog id="code-modal" class="w-11/12 max-w-4xl p-0 bg-transparent rounded-xl shadow-2xl backdrop:bg-slate-900/90">
        <div class="bg-slate-900 flex flex-col h-[80vh] rounded-xl overflow-hidden border border-slate-700">
            <!-- Cabeçalho com Abas -->
            <div class="flex justify-between items-center p-0 pr-4 border-b border-slate-800 bg-slate-950 pt-4">
                <div class="flex gap-2 px-6">
                    <button id="tab-html" onclick="switchTab('html')" class="text-sm text-white font-bold flex items-center gap-2 border-b-2 border-indigo-500 pb-3 px-2 transition"><i data-feather="code" class="w-4 h-4 text-indigo-400"></i> HTML</button>
                    <button id="tab-css" onclick="switchTab('css')" class="text-sm text-slate-500 hover:text-white font-bold flex items-center gap-2 border-b-2 border-transparent pb-3 px-2 transition"><i data-feather="pen-tool" class="w-4 h-4 text-pink-400"></i> CSS</button>
                </div>
                <button onclick="document.getElementById('code-modal').close()" class="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 p-2 mb-3 rounded transition">
                    <i data-feather="x" class="w-4 h-4"></i>
                </button>
            </div>
            <!-- Áreas de Código -->
            <div class="flex-1 overflow-auto p-6 text-sm text-green-400 font-mono whitespace-pre-wrap leading-relaxed" id="code-content-html"></div>
            <div class="flex-1 overflow-auto p-6 text-sm text-pink-300 font-mono whitespace-pre-wrap leading-relaxed hidden" id="code-content-css"></div>
        </div>
    </dialog>

    <dialog id="preview-modal" class="w-full h-full max-w-none max-h-none m-0 p-0 bg-slate-100 border-none">
        <div class="fixed top-4 right-4 z-50">
            <button onclick="document.getElementById('preview-modal').close()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-full shadow-xl font-bold flex items-center gap-2 transition transform hover:scale-105">
                <i data-feather="arrow-left" class="w-5 h-5"></i> Voltar ao Editor
            </button>
        </div>
        <div id="preview-content" class="min-h-screen"></div>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
